# Loaded inside nginx's http context. Keep other sites unchanged.
map $http_upgrade $island_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 159.75.2.196 app.liuli2026.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://app.liuli2026.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.liuli2026.top;

    ssl_certificate /etc/letsencrypt/live/app.liuli2026.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.liuli2026.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    proxy_pass_header X-Request-ID;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $island_connection_upgrade;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location = / { return 302 /h5/; }
    location /internal/ { return 404; }

    location = /api/v2/voice/transcriptions/stream {
        proxy_pass http://127.0.0.1:18000;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location = /api/v2/voice/transcriptions {
        proxy_pass http://127.0.0.1:18000;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
