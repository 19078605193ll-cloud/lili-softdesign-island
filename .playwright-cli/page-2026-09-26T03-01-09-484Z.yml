              - textbox "共享题干（普通单题留空）" [ref=f1e183]: "Regardless of how well designed, constructed, and tested a system or application may be, errors or bugs will inevitably occur. Once a system has been (71), it enters operations and support. Systems support is the ongoing technical support for users, as well as the maintenance required to fix any errors, omissions, or new requirements that may arise. Before an information system can be (72), it must be in operation. System operation is the day-to-day, week-to-week, month-to-month, and year-to-year (73) of an information system's business processes and application programs. Unlike systems analysis, design, and implementation, systems support cannot sensibly be (74) into actual phases that a support project must perform. Rather, systems support consists of four ongoing activities: program maintenance, system recovery, technical support, and system enhancement. Each activity is a type of support project that is (75) by a particular problem, event, or opportunity encountered with the implemented system."
