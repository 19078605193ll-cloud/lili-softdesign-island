              - generic [ref=f1e208]:
                - generic [ref=f1e209]: 解析
                - textbox "解析" [ref=f1e210]: A. designed：设计 B. implemented：实施 C. investigated：调查 D. analyzed：分析 A. supported：支持 B. tested：测试 C. implemented：实施 D. constructed：构建 A. construction：构建 B. maintenance：维护 C. execution：执行 D. implementation：实施 A. broke：打破 B. formed：形成 C. composed：组成 D. decomposed：分解 A. triggered：触发 B. leaded：引导 C. caused：引起、导致 D. produced：产生 全文翻译：无论一个系统或应用程序的设计、构建和测试多么完善，错误或缺陷都不可避免地会出现。一旦系统实施完成（71），就会进入运行与支持阶段。 系统支持是指为用户提供持续的技术支持，以及为修复可能出现的错误、遗漏或满足新需求而进行的维护工作。信息系统必须先投入运行，才能获得支持（72）。系统运行是指日复一日、周复一周、月复一月、年复一年地执行（73）信息系统的业务流程和应用程序。 与系统分析、设计和实施不同，系统支持不能合理地分解（74）为支持项目必须执行的具体阶段。相反，系统支持包含四项持续进行的活动：程序维护、系统恢复、技术支持和系统增强。每项活动都是一种支持项目，由已实施系统中遇到的特定问题、事件或机会所触发（75）。
