          - generic [ref=f1e471]:
            - paragraph [ref=f1e472]: 71-75.
            - paragraph [ref=f1e473]: Software entities are more complex for their size than perhaps any other human construct, because no two parts are alike (at least above the statement level). If they are, we make the two similar parts into one, a (71), open or closed. In this respect software systems differ profoundly from computers, buildings, or automobiles, where repeated elements abound.
            - paragraph [ref=f1e474]: Digital computers are themselves more complex than most things people build; they have very large numbers of states. This makes conceiving, describing, and testing
            - paragraph [ref=f1e475]: them hard. Software systems have orders of magnitude more (72) than computers do.
            - paragraph [ref=f1e476]: Likewise, a scaling-up of a software entity is not merely a repetition of the same elements in larger size; it is necessarily an increase in the number of different elements. In most cases, the elements interact with each other in some (73) fashion, and the complexity of the whole increases much more than linearly. The complexity of software is a(an) (74) property, not an accidental one. Hence descriptions of a software entity that abstract away its complexity often abstract away its essence. Mathematics and the physical sciences made great strides for three centuries by constructing simplified models of complex phenomena, deriving properties from the models, and verifying those properties experimentally. This worked because the complexities (75) in the models were not the essential properties of the phenomena. It does not work when the complexities are the essence.
            - paragraph [ref=f1e477]: Many of the classical problems of developing software products derive from this essential complexity and its nonlinear increases with size. Not only technical problems but management problems as well come from the complexity.
            - paragraph [ref=f1e478]: 71、A. task B. job C. subroutine D. program
            - paragraph [ref=f1e479]: 72、 A. states B. parts C. conditions D. expressions
            - paragraph [ref=f1e480]: 73、A. linear B. nonlinear C. parallel D. additive
            - paragraph [ref=f1e481]: 74、A. surface B. outside C. exterior D. essential
            - paragraph [ref=f1e482]: 75、A. fixed B. included C. ignored D. stabilized
            - paragraph [ref=f1e483]: "答案: C A B D C"
            - paragraph [ref=f1e484]: 解析：A. task（任务）B. job（工作）C. subroutine（子程序） D. program（程序）
            - paragraph [ref=f1e485]: A. states（状态）B. parts（部分）C. conditions（条件）D. expressions（表达式）
            - paragraph [ref=f1e486]: A. linear（线性的） B. nonlinear（非线性的）C. parallel（并行的）D. additive（附加的）
            - paragraph [ref=f1e487]: A. surface（表面的） B. outside（外部的） C. exterior（外在的）D. essential（本质的）
            - paragraph [ref=f1e488]: A. fixed（固定）B. included（包含）C. ignored（忽略）D. stabilized（稳定）
            - paragraph [ref=f1e489]: 软件实体的规模越大，其复杂程度往往比其他任何人类创造物都更高，因为没有两个部分是完全相同的（至少在声明层面以上是如此）。如果存在两个相似部分，我们可以将这两个相似部分合并成一个（ ），无论它是开放的还是封闭的。
            - paragraph [ref=f1e490]: 在这一方面，软件系统与计算机、建筑物或汽车有着根本区别，因为后者存在大量重复元素。
            - paragraph [ref=f1e491]: 数字计算机本身比大多数人制造的东西更加复杂；它们具有非常大量的状态。这使得理解、描述和测试它们变得困难。软件系统拥有比计算机多几个数量级的（ ）。
            - paragraph [ref=f1e492]: 同样，将一个软件实体进行规模扩大，并不仅仅是简单重复相同元素，而是必然增加不同元素的数量。在大多数情况下，这些元素之间以某种（ ）方式相互作用，因此整体复杂度的增加远远超过线性增长。
            - paragraph [ref=f1e493]: 软件复杂性是一种（ ）属性，而不是偶然产生的属性。因此，那些通过抽象软件实体来降低复杂度的描述，往往也会抽象掉它的本质。
            - paragraph [ref=f1e494]: 数学和物理科学在过去三个世纪取得巨大进步，是因为它们通过构建复杂现象的简化模型，从模型中推导属性，并通过实验验证这些属性。
            - paragraph [ref=f1e495]: 这种方法有效，是因为模型中的复杂性（ ）并不是现象的本质属性。
            - paragraph [ref=f1e496]: 当复杂性本身就是本质时，这种方法便无法发挥作用。
            - paragraph [ref=f1e497]: 许多经典的软件开发问题都来源于这种本质复杂性，以及随着规模增加而产生的非线性增长。不仅技术问题，管理问题同样来自这种复杂性。
