services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: software_designer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d software_designer"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - software_designer_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  software_designer_pgdata:

