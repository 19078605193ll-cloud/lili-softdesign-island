        topics:
          - {code: oo-uml-patterns.uml-structure.class-object, name: 类图与对象图, description: 类、接口、关系、多重度以及对象实例快照。, aliases: [UML类图, 对象图], keywords: [类图, 对象图, 多重度, 接口], classification_guidance: 以类的静态结构或对象实例关系为主时匹配。, syllabus_refs: [面向对象基础/UML]}
          - {code: oo-uml-patterns.uml-structure.package-component, name: 包图与构件图, description: 模型包依赖和软件构件接口关系。, aliases: [组件图], keywords: [包图, 构件图, 组件, 接口], classification_guidance: 表达代码模块、构件或包依赖时匹配。, syllabus_refs: [面向对象基础/UML]}
          - {code: oo-uml-patterns.uml-structure.deployment, name: 部署图, description: 执行结点、制品和部署连接关系。, aliases: [配置图], keywords: [部署图, 节点, 制品, 通信路径], classification_guidance: 描述软件制品在硬件节点上的部署时匹配。, syllabus_refs: [面向对象基础/UML]}
      - code: oo-uml-patterns.uml-behavior
