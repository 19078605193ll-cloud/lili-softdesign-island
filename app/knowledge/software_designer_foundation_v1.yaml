version: "1.0.0"
source_name: "全国计算机专业技术资格考试办公室《软件设计师考试大纲》（2018年审定）"
source_reference: "https://www.tup.tsinghua.edu.cn/bookscenter/book_07814301.html"
subject:
  code: software-designer.foundation
  name: 软件设计师基础知识（上午题）
  qualification_level: 中级
  paper_kind: 基础知识
chapters:
  - code: cs-math
    name: 计算机科学与数学基础
    description: 数制、数据表示、逻辑和软件设计相关的离散与应用数学基础。
    modules:
      - code: cs-math.data-representation
        name: 数制与数据表示
        description: 计算机中数值和非数值信息的表示。
        topics:
          - {code: cs-math.data-representation.base-conversion, name: 进制与转换, description: 二、八、十、十六进制表示及相互转换。, aliases: [数制转换, 进制换算], keywords: [二进制, 十六进制, 基数], classification_guidance: 涉及不同进制数值互换或按位权展开时匹配。, syllabus_refs: [计算机内数据的表示及运算/数的表示]}
          - {code: cs-math.data-representation.signed-number, name: 原码反码与补码, description: 有符号整数的原码、反码、补码及表示范围。, aliases: [机器数, 补码], keywords: [符号位, 原码, 反码, 补码], classification_guidance: 涉及负数机器表示、取值范围或补码运算时匹配。, syllabus_refs: [计算机内数据的表示及运算/数的表示]}
          - {code: cs-math.data-representation.fixed-point, name: 定点数表示, description: 定点整数和定点小数的格式、范围与精度。, aliases: [定点表示], keywords: [定点数, 小数点, 表示范围], classification_guidance: 题干核心为固定小数点位置或定点数范围时匹配。, syllabus_refs: [计算机内数据的表示及运算/数的表示]}
          - {code: cs-math.data-representation.floating-point, name: 浮点数表示, description: 浮点数阶码、尾数、规格化、范围与精度。, aliases: [浮点表示, IEEE浮点数], keywords: [阶码, 尾数, 规格化, IEEE754], classification_guidance: 涉及浮点格式、规格化或浮点范围精度时匹配。, syllabus_refs: [计算机内数据的表示及运算/数的表示]}
          - {code: cs-math.data-representation.overflow-precision, name: 溢出与精度, description: 数值表示中的溢出判断、截断误差和精度问题。, aliases: [数值溢出, 舍入误差], keywords: [溢出, 精度, 舍入], classification_guidance: 以运算结果是否溢出或误差大小为主时匹配。, syllabus_refs: [计算机内数据的表示及运算/二进制数运算]}
          - {code: cs-math.data-representation.character-encoding, name: 字符与汉字编码, description: ASCII、Unicode、汉字编码及字符存储容量。, aliases: [字符编码, 汉字编码], keywords: [ASCII, Unicode, GBK, 字符集], classification_guidance: 涉及字符集、编码值或字符占用空间时匹配。, syllabus_refs: [计算机内数据的表示及运算/非数值表示]}
      - code: cs-math.logic-operation
        name: 运算与逻辑
        description: 二进制运算和逻辑代数基础。
        topics:
          - {code: cs-math.logic-operation.binary-arithmetic, name: 二进制算术运算, description: 二进制加减乘除及补码算术运算。, aliases: [机器运算], keywords: [二进制加法, 补码运算, 移位], classification_guidance: 需要执行二进制算术或移位计算时匹配。, syllabus_refs: [计算机内数据的表示及运算/二进制数运算]}
          - {code: cs-math.logic-operation.boolean-algebra, name: 逻辑代数, description: 与、或、非、异或及逻辑代数基本定律。, aliases: [布尔代数], keywords: [与或非, 德摩根, 异或], classification_guidance: 涉及布尔运算规则和表达式化简时匹配。, syllabus_refs: [计算机内数据的表示及运算/逻辑代数]}
          - {code: cs-math.logic-operation.logic-expression, name: 逻辑表达式与真值表, description: 逻辑表达式、真值表和等价判断。, aliases: [真值表], keywords: [逻辑表达式, 真值, 等价], classification_guidance: 以真值表求值或逻辑等价为主时匹配。, syllabus_refs: [计算机内数据的表示及运算/逻辑代数]}
      - code: cs-math.applied-math
        name: 离散与应用数学
        description: 概率、逻辑、集合和运筹等基础方法。
        topics:
          - {code: cs-math.applied-math.combinatorics, name: 排列组合, description: 排列、组合和基本计数原理。, aliases: [组合数学], keywords: [排列, 组合, 计数], classification_guidance: 涉及方案数量或排列组合公式时匹配。, syllabus_refs: [其他数学基础知识/排列组合]}
          - {code: cs-math.applied-math.probability-statistics, name: 概率与统计, description: 基本概率、期望和描述性统计计算。, aliases: [概率论, 应用统计], keywords: [概率, 期望, 方差, 均值], classification_guidance: 涉及随机事件概率或统计量时匹配。, syllabus_refs: [其他数学基础知识/概率论与应用统计]}
          - {code: cs-math.applied-math.propositional-logic, name: 命题逻辑, description: 命题联结词、推理与等价式。, aliases: [形式逻辑], keywords: [命题, 蕴含, 等价], classification_guidance: 题目以命题真假和演绎推理为核心时匹配。, syllabus_refs: [其他数学基础知识/命题逻辑]}
          - {code: cs-math.applied-math.predicate-logic, name: 谓词逻辑, description: 谓词、量词和谓词公式基础。, aliases: [一阶逻辑], keywords: [谓词, 全称量词, 存在量词], classification_guidance: 涉及量词、谓词或谓词公式转换时匹配。, syllabus_refs: [其他数学基础知识/谓词逻辑]}
          - {code: cs-math.applied-math.set-relation, name: 集合关系与函数, description: 集合运算、关系性质和函数映射。, aliases: [集合论, 二元关系], keywords: [集合, 关系, 映射, 等价关系], classification_guidance: 涉及集合运算、关系性质或函数映射时匹配。, syllabus_refs: [其他数学基础知识/形式逻辑]}
          - {code: cs-math.applied-math.coding-theory, name: 编码基础, description: 信息编码、码距和检错纠错基本概念。, aliases: [码距, 校验码基础], keywords: [编码, 码距, 检错, 纠错], classification_guidance: 以码字、码距和纠错能力为核心时匹配。, syllabus_refs: [其他数学基础知识/编码基础]}
          - {code: cs-math.applied-math.operations-research, name: 运筹方法, description: 线性规划、决策和最优化的基础方法。, aliases: [运筹学, 线性规划], keywords: [最优化, 线性规划, 决策], classification_guidance: 涉及资源约束下求最优方案时匹配。, syllabus_refs: [其他数学基础知识/运筹基本方法]}

  - code: architecture
    name: 计算机组成与体系结构
    description: 计算机硬件组成、指令、存储、输入输出、性能与可靠性。
    modules:
      - code: architecture.cpu-instruction
        name: CPU 与指令系统
        description: 处理器组成和指令执行机制。
        topics:
          - {code: architecture.cpu-instruction.cpu-components, name: CPU组成与功能, description: 运算器、控制器和寄存器的结构与职责。, aliases: [处理器组成], keywords: [运算器, 控制器, 寄存器], classification_guidance: 询问CPU部件职责或数据通路时匹配。, syllabus_refs: [计算机硬件基础/CPU组成]}
          - {code: architecture.cpu-instruction.instruction-cycle, name: 指令周期与执行, description: 取指、分析、执行和中断周期。, aliases: [机器周期, 取指周期], keywords: [指令周期, 取指, 执行], classification_guidance: 涉及指令执行阶段或周期关系时匹配。, syllabus_refs: [计算机硬件基础/CPU工作原理]}
          - {code: architecture.cpu-instruction.addressing-mode, name: 寻址方式, description: 立即、直接、间接、寄存器和变址等寻址方式。, aliases: [指令寻址], keywords: [有效地址, 直接寻址, 间接寻址, 变址], classification_guidance: 需要计算有效地址或辨识寻址模式时匹配。, syllabus_refs: [计算机硬件基础/CPU工作原理]}
          - {code: architecture.cpu-instruction.interrupt, name: 中断机制, description: 中断请求、响应、向量和处理过程。, aliases: [中断处理], keywords: [中断向量, 中断响应, 优先级], classification_guidance: 涉及硬件中断过程或优先级时匹配。, syllabus_refs: [计算机硬件基础/I-O基本原理]}
      - code: architecture.storage
        name: 存储系统
        description: 多级存储体系、Cache、主辅存和磁盘阵列。
        topics:
          - {code: architecture.storage.hierarchy, name: 存储层次体系, description: 寄存器、Cache、主存和辅存的层次关系。, aliases: [多级存储], keywords: [局部性, 容量, 速度, 层次], classification_guidance: 比较各级存储速度容量或讨论局部性时匹配。, syllabus_refs: [存储系统/多级存储体系]}
          - {code: architecture.storage.cache-mapping, name: Cache映射与命中, description: 直接、全相联、组相联映射和命中率计算。, aliases: [高速缓存映射], keywords: [Cache, 命中率, 组相联, 地址映射], classification_guidance: 计算Cache地址字段、映射位置或命中率时匹配。, syllabus_refs: [存储系统/多级存储体系]}
          - {code: architecture.storage.cache-replacement, name: Cache替换与写策略, description: LRU等替换算法以及写回、直写策略。, aliases: [缓存替换], keywords: [LRU, 写回, 直写], classification_guidance: 以Cache块替换或写策略为核心时匹配。, syllabus_refs: [存储系统/多级存储体系]}
          - {code: architecture.storage.main-memory, name: 主存组织, description: 存储芯片组织、地址扩展和存储容量计算。, aliases: [内存编址], keywords: [存储芯片, 地址线, 位扩展, 字扩展], classification_guidance: 计算存储芯片数量、地址范围或容量时匹配。, syllabus_refs: [计算机硬件基础/存储器组成]}
          - {code: architecture.storage.secondary-storage, name: 辅存与磁盘性能, description: 磁盘结构、容量、寻道和数据传输时间。, aliases: [磁盘存储], keywords: [磁道, 扇区, 寻道时间, 转速], classification_guidance: 计算磁盘容量或访问时间时匹配。, syllabus_refs: [存储系统/网络存储技术]}
          - {code: architecture.storage.raid, name: RAID级别与特性, description: RAID常见级别的容量、性能和容错特性。, aliases: [磁盘阵列], keywords: [RAID0, RAID1, RAID5, 冗余], classification_guidance: 比较RAID级别或计算可用容量时匹配。, syllabus_refs: [存储系统/RAID类型和特性]}
      - code: architecture.io-bus
        name: 总线与输入输出
        description: 总线、接口和I/O控制方式。
        topics:
          - {code: architecture.io-bus.bus, name: 总线结构与性能, description: 数据、地址、控制总线及总线带宽计算。, aliases: [系统总线], keywords: [总线宽度, 总线频率, 带宽], classification_guidance: 涉及总线类型或带宽吞吐计算时匹配。, syllabus_refs: [计算机硬件基础/I-O接口]}
          - {code: architecture.io-bus.io-interface, name: I/O接口, description: 输入输出接口的功能、类型和特性。, aliases: [设备接口], keywords: [接口, 端口, 控制寄存器], classification_guidance: 询问接口职责、端口或设备控制寄存器时匹配。, syllabus_refs: [计算机硬件基础/I-O接口]}
          - {code: architecture.io-bus.dma, name: DMA方式, description: DMA控制器及其数据传送过程。, aliases: [直接存储器访问], keywords: [DMA, 总线请求, 数据块], classification_guidance: CPU不逐字干预的块传送问题匹配。, syllabus_refs: [计算机硬件基础/I-O工作原理]}
          - {code: architecture.io-bus.io-control, name: I/O控制方式, description: 程序查询、中断和通道等I/O方式。, aliases: [输入输出控制], keywords: [程序查询, 中断驱动, 通道], classification_guidance: 比较设备数据传送控制方式时匹配。, syllabus_refs: [计算机硬件基础/I-O工作原理]}
      - code: architecture.system-architecture
        name: 体系结构
        description: 指令体系、流水线和并行处理。
        topics:
          - {code: architecture.system-architecture.risc-cisc, name: RISC与CISC, description: 精简和复杂指令系统的设计特征。, aliases: [精简指令集, 复杂指令集], keywords: [RISC, CISC, 指令格式], classification_guidance: 比较两类指令系统特点时匹配。, syllabus_refs: [体系结构分类及特性/CISC-RISC]}
          - {code: architecture.system-architecture.pipeline, name: 流水线, description: 流水线周期、吞吐率、加速比和冲突。, aliases: [指令流水], keywords: [流水线, 吞吐率, 加速比, 冲突], classification_guidance: 涉及流水执行时间或性能计算时匹配。, syllabus_refs: [体系结构分类及特性/流水线操作]}
          - {code: architecture.system-architecture.parallel, name: 并行与多处理机, description: 并行处理、多处理机和体系结构分类基础。, aliases: [并行计算], keywords: [多处理机, 并行, Flynn], classification_guidance: 以并行体系或多处理器分类为核心时匹配。, syllabus_refs: [体系结构分类及特性/多处理机并行处理]}
      - code: architecture.performance-reliability
        name: 性能与可靠性
        description: 系统性能指标、可靠性和容错计算。
        topics:
          - {code: architecture.performance-reliability.performance-metrics, name: CPU性能指标, description: 时钟周期、CPI、MIPS和执行时间计算。, aliases: [处理器性能], keywords: [CPI, MIPS, 主频, 执行时间], classification_guidance: 以CPU指令执行性能公式为主时匹配。, syllabus_refs: [可靠性与性能评测/性能评测方法]}
          - {code: architecture.performance-reliability.benchmark, name: 系统性能评测, description: 基准程序、吞吐量和响应时间等评测方法。, aliases: [Benchmark], keywords: [基准测试, 吞吐量, 响应时间], classification_guidance: 比较系统总体性能或评测方法时匹配。, syllabus_refs: [可靠性与性能评测/性能评测方法]}
          - {code: architecture.performance-reliability.reliability, name: 系统可靠性计算, description: 串联、并联和冗余系统可靠性计算。, aliases: [可靠度], keywords: [串联系统, 并联系统, MTBF], classification_guidance: 计算部件组合后的系统可靠度时匹配。, syllabus_refs: [可靠性与性能评测/可靠性分析]}
          - {code: architecture.performance-reliability.fault-tolerance, name: 故障诊断与容错, description: 冗余、容错和故障诊断基本技术。, aliases: [容错技术], keywords: [冗余, 故障, 容错], classification_guidance: 讨论硬件故障检测或冗余容错时匹配。, syllabus_refs: [可靠性与性能评测/诊断与容错]}

  - code: os
    name: 操作系统
    description: 操作系统内核、资源管理和运行机制。
    modules:
      - code: os.foundation
        name: 操作系统基础
        description: 操作系统目标、功能、类型和内核。
        topics:
          - {code: os.foundation.concepts, name: 操作系统概念与功能, description: 操作系统的目标、特征和资源管理功能。, aliases: [OS基础], keywords: [操作系统, 资源管理, 并发, 共享], classification_guidance: 询问操作系统基本职责或特征时匹配。, syllabus_refs: [操作系统知识/基本概念]}
          - {code: os.foundation.kernel, name: 内核与系统调用, description: 内核态、用户态、系统调用和内核结构。, aliases: [核心态, 管态], keywords: [内核, 系统调用, 用户态, 内核态], classification_guidance: 涉及特权级切换或系统调用时匹配。, syllabus_refs: [操作系统知识/操作系统内核]}
          - {code: os.foundation.os-types, name: 操作系统类型, description: 批处理、分时、实时、网络和嵌入式操作系统。, aliases: [批处理系统, 分时系统, 实时系统], keywords: [分时, 实时, 批处理, 嵌入式], classification_guidance: 识别或比较操作系统运行类型时匹配。, syllabus_refs: [操作系统知识/操作系统配置]}
      - code: os.process
        name: 进程与处理机管理
        description: 进程线程、调度、同步和死锁。
        topics:
          - {code: os.process.process-thread, name: 进程与线程, description: 进程、线程、PCB和资源归属。, aliases: [PCB, 轻量级进程], keywords: [进程, 线程, PCB], classification_guidance: 比较进程线程或询问PCB内容时匹配。, syllabus_refs: [操作系统知识/处理机管理]}
          - {code: os.process.state-transition, name: 进程状态转换, description: 就绪、运行、阻塞等状态及转换原因。, aliases: [进程三态, 进程五态], keywords: [就绪, 运行, 阻塞, 状态转换], classification_guidance: 根据事件判断进程状态变化时匹配。, syllabus_refs: [操作系统知识/处理机管理]}
          - {code: os.process.scheduling, name: 处理机调度, description: 先来先服务、短作业、优先级、时间片等算法。, aliases: [CPU调度, 进程调度], keywords: [FCFS, SJF, 时间片, 周转时间], classification_guidance: 比较调度策略或计算等待周转时间时匹配。, syllabus_refs: [操作系统知识/处理机管理]}
          - {code: os.process.sync, name: 同步互斥与PV操作, description: 临界区、信号量、PV操作和经典同步问题。, aliases: [进程同步, 信号量], keywords: [PV操作, P操作, V操作, 临界区, 互斥], classification_guidance: 题目包含信号量取值、PV顺序或同步关系时匹配。, syllabus_refs: [操作系统知识/处理机管理]}
          - {code: os.process.deadlock, name: 死锁, description: 死锁条件、预防、避免、检测和银行家算法。, aliases: [资源死锁], keywords: [死锁, 银行家算法, 安全序列], classification_guidance: 判断安全状态、资源分配或死锁条件时匹配。, syllabus_refs: [操作系统知识/处理机管理]}
      - code: os.memory
        name: 存储管理
        description: 内存分配、地址转换和虚拟存储。
        topics:
          - {code: os.memory.partition, name: 分区存储管理, description: 固定和可变分区、分配算法及碎片。, aliases: [连续分配], keywords: [首次适应, 最佳适应, 碎片], classification_guidance: 涉及连续内存分区或分配算法时匹配。, syllabus_refs: [操作系统知识/存储管理]}
          - {code: os.memory.paging, name: 分页与地址转换, description: 页、页框、页表和逻辑物理地址转换。, aliases: [页式存储], keywords: [页表, 页号, 页内地址, 快表], classification_guidance: 计算页号、物理地址或页表大小时匹配。, syllabus_refs: [操作系统知识/存储管理]}
          - {code: os.memory.segmentation, name: 分段与段页式, description: 分段和段页式存储的地址结构与保护。, aliases: [段式存储, 段页式], keywords: [段表, 段号, 段页式], classification_guidance: 涉及按逻辑段管理或段页地址转换时匹配。, syllabus_refs: [操作系统知识/存储管理]}
