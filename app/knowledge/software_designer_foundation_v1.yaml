          - {code: oo-uml-patterns.oo-foundation.oo-testing, name: 面向对象测试, description: 类测试、继承测试、交互测试和基于场景测试。, aliases: [OO测试], keywords: [类测试, 交互, 继承层次], classification_guidance: 面向类、继承或对象协作的测试问题匹配。, syllabus_refs: [面向对象测试]}
