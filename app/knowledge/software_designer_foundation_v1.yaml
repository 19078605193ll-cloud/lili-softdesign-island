          - {code: oo-uml-patterns.design-patterns.structural, name: 结构型模式, description: 适配器、桥接、组合、装饰、外观、享元和代理模式。, aliases: [对象结构模式], keywords: [适配器, 装饰, 代理, 外观, 组合], classification_guidance: 通过组合类或对象形成更大结构时匹配。, syllabus_refs: [面向对象基础/设计模式]}
          - {code: oo-uml-patterns.design-patterns.behavioral, name: 行为型模式, description: 责任链、命令、迭代器、观察者、状态、策略、模板方法等。, aliases: [对象行为模式], keywords: [观察者, 策略, 状态, 命令, 模板方法], classification_guidance: 分配对象职责或组织对象交互算法时匹配。, syllabus_refs: [面向对象基础/设计模式]}
          - {code: oo-uml-patterns.design-patterns.pattern-selection, name: 模式辨识与应用, description: 根据意图、结构和变化点选择设计模式。, aliases: [模式应用], keywords: [模式意图, 可扩展性, 解耦], classification_guidance: 场景题要求辨识或选择具体设计模式时匹配。, syllabus_refs: [面向对象基础/分析模式与设计模式]}

