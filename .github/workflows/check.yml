name: backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app tests scripts --select E9,F63,F7,F82
      - run: uv run mypy app/core/runtime.py app/practice/schemas.py app/practice/service.py --follow-imports=skip
      - run: uv run python scripts/test_isolated.py -q --tb=short
      - run: docker build -t softdesign-island:ci .
